version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-tooling:
        patterns: ["ruff", "ty"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["ruff", "ty"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
  # The checkers that the comparison pins. No check on the pull request runs them: CI
  # compiles the Rust adapters against a new version, and what else a version breaks
  # shows in the comparison of the next release. The adapters written in Python pin
  # theirs inside adapter.py, which is updated by hand.
  - package-ecosystem: cargo
    directory: /checkers/jsoncompat
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /checkers/subsumes
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: maven
    directory: /checkers/confluent
    schedule:
      interval: weekly
      day: monday
