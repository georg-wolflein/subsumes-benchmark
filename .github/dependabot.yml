version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-tooling:
        patterns: ["ruff", "ty"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["ruff", "ty"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
  # The checkers that the comparison pins. No check on the pull request runs them: a
  # version that breaks an adapter shows in the comparison of the next release. The
  # adapters written in Python pin theirs inside adapter.py, which is updated by hand.
  - package-ecosystem: cargo
    directory: /checkers/jsoncompat
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: maven
    directory: /checkers/confluent
    schedule:
      interval: weekly
      day: monday
