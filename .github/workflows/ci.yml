name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  CARGO_TERM_COLOR: always

jobs:
  # Every static check shares one job: each is seconds of work behind the environment
  # setup, and each step runs whenever the setup succeeded so one failure does not hide
  # the others. The adapters under checkers/ are checked here too: the Python ones by ruff
  # with everything else and by ty, each against its own environment, and the Rust ones by
  # cargo, which the runner has.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: setup
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check that the lockfile is current
        run: uv lock --check
      - name: Install
        run: uv sync --all-groups --all-extras
      - name: ruff check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check --output-format=github .
      - name: ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: ty check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ty check
      - name: ty check, the Python adapters
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          status=0
          for adapter in checkers/*/adapter.py; do
            uv sync --quiet --locked --script "$adapter"
            uv run ty check --python "$(uv python find --script "$adapter")" "$adapter" || status=1
          done
          exit "$status"
      - name: check-jsonschema, the configuration files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          status=0
          uv run check-jsonschema --check-metaschema schemas/*.schema.json || status=1
          uv run check-jsonschema --schemafile schemas/collections.schema.json collections.json || status=1
          uv run check-jsonschema --schemafile schemas/overrides.schema.json overrides.json || status=1
          uv run check-jsonschema --schemafile schemas/derived.schema.json derived.json || status=1
          uv run check-jsonschema --schemafile schemas/checker.schema.json checkers/*/checker.json || status=1
          uv run check-jsonschema --schemafile schemas/comparison.schema.json comparison/comparison.json || status=1
          exit "$status"
      - name: the README is what the corpus and the comparison give
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run scripts/readme.py --check
      - name: datamodel-codegen, the generated models are current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          status=0
          for model in collections:CollectionsSpec overrides:OverridesSpec derived:DerivedSpec checker:CheckerSpec \
              case:CaseSpec ready:ReadySpec request:RequestSpec reply:ReplySpec result:ResultSpec run:RunSpec \
              comparison:ComparisonSpec; do
            uv run datamodel-codegen --check --input "schemas/${model%%:*}.schema.json" \
              --output "src/subsumes_benchmark/generated/${model%%:*}.py" --class-name "${model##*:}" || status=1
          done
          exit "$status"
      - name: cargo fmt, the Rust adapters
        if: ${{ !cancelled() }}
        run: |
          status=0
          for manifest in checkers/*/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --check || status=1
          done
          exit "$status"
      - name: cargo clippy, the Rust adapters
        if: ${{ !cancelled() }}
        run: |
          status=0
          for manifest in checkers/*/Cargo.toml; do
            cargo clippy --manifest-path "$manifest" --locked --all-targets -- --deny warnings || status=1
          done
          exit "$status"

  # The tests: the build's transformations, and the committed corpus. They read every case of
  # it: its layout holds, each case matches the schema of a case, so that its schemas are valid
  # draft 2020-12, each reference resolves, each case lists the features of its schemas, and
  # each label that validation can check holds. They need no upstream sources, so the
  # submodules under sources/ stay unfetched.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups --all-extras
      - run: uv run pytest
