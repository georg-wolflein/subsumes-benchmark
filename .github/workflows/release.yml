name: Release

# release-please keeps one pull request open that raises the version by what the commits on
# main since the last release call for; release-please-config.json says how. Merging that
# pull request is the release: this workflow then tags the merged commit v<version>, packs
# the corpus of that commit into one archive, publishes the package with the archive in it
# to PyPI, and attaches the same archive to the release.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time. A run that waits is replaced by the run of a newer push, which then
# does the work of both.
concurrency: release

jobs:
  # Opens or updates the release pull request. On the push that merges it, creates the tag
  # and a draft of the release instead. It acts as a GitHub App: a pull request opened with
  # this workflow's own token would not start the checks that a merge requires.
  release-please:
    if: vars.PR_BOT_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  # The package of the release on PyPI: the command that runs a checker, with the corpus in
  # it as one archive. What the package holds is checked here before anything is uploaded,
  # since a file on PyPI cannot be replaced. The archive is handed to the next job, so that
  # the release has the file that the package has.
  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to show PyPI which workflow asks
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }} # not always the commit of this run
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Pack the corpus
        # Sorted entries without times and owners, so the file depends only on the corpus.
        run: make archive
      - name: Build the package
        run: uv build
      - name: Check that the package has the version of the release, and the corpus as the archive only
        run: |
          version="${TAG#v}"
          ls dist
          test -f "dist/subsumes_benchmark-$version-py3-none-any.whl"
          test -f "dist/subsumes_benchmark-$version.tar.gz"
          python -m zipfile --list dist/*.whl > "$RUNNER_TEMP/wheel"
          tar -tzf dist/*.tar.gz > "$RUNNER_TEMP/source"
          for files in wheel source; do
            grep -q 'subsumes_benchmark/corpus\.tar\.zst' "$RUNNER_TEMP/$files"
          done
          if cat "$RUNNER_TEMP/wheel" "$RUNNER_TEMP/source" \
              | grep -E '(^|/)(sources|comparison|checkers)/|/corpus/[^ ]*\.json'; then
            echo "::error::the package holds files that are neither code nor the archive"
            exit 1
          fi
          # What the installed package unpacks is the corpus of the tag.
          uvx --from dist/*.whl subsumes-benchmark corpus "$RUNNER_TEMP/unpacked"
          diff --recursive --brief corpus "$RUNNER_TEMP/unpacked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus
          path: src/subsumes_benchmark/corpus.tar.zst
          if-no-files-found: error
      # No token is stored: PyPI trusts this workflow of this repository. A file that PyPI
      # has already, from an earlier attempt, is left as it is.
      - name: Publish the package to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  # The release stays a draft until PyPI has the package and the archive is attached, so
  # that a release that can be seen always has both. Nothing is checked here: the release
  # pull request changes the version only, and the corpus it releases was checked on main
  # and on every pull request that changed it.
  publish:
    needs: [release-please, package]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }} # the job has no checkout that would say
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # The archive that the package holds, as the job before packed it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus
      - name: Attach the archive and publish the release
        # The notes are those of the release pull request, below the checksum. A line with
        # a checksum that is there already, from an earlier attempt, is replaced.
        run: |
          gh release upload "$TAG" corpus.tar.zst --clobber
          {
            printf 'SHA-256 of `corpus.tar.zst`: `%s`\n\n' "$(sha256sum corpus.tar.zst | cut -d ' ' -f 1)"
            gh release view "$TAG" --json body --jq .body \
              | sed -e '/^SHA-256 of `corpus\.tar\.zst`: /d' | sed -e '/./,$!d'
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false

  # The comparison of checkers on the released corpus. It is started as a run of its own,
  # hours long, so that the release neither waits for it nor fails with it.
  comparison:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the comparison on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh workflow run comparison.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  # Tells subsumes that the corpus can be downloaded, with the event `benchmark-released`.
  # Its workflow benchmark-release.yml then pins its Makefile to the release.
  notify:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: subsumes
          permission-contents: write # to send the event
      - name: Tell subsumes about the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY_OWNER/subsumes/dispatches" \
            -f event_type=benchmark-released -f "client_payload[version]=${TAG#v}"
