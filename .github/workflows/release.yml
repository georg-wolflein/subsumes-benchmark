name: Release

# A release is a tag v<version> on main, pushed by `make release`. It carries the corpus as
# one archive, built here from the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to see that the tag is on main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check that the tag is the version in pyproject.toml, on main
        run: |
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build the archive
        run: uv run --no-dev python -m subsumes_benchmark.archive
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/corpus.tar.zst --verify-tag --generate-notes \
            --notes "SHA-256 of \`corpus.tar.zst\`: \`$(sha256sum dist/corpus.tar.zst | cut -d ' ' -f 1)\`"
