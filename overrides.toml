# Where the corpus departs from upstream, and why.
#
# Each [[exclude]] lists upstream cases that the corpus leaves out, with the reason. A case is
# left out when one of its schemas is not valid draft 2020-12 or does not resolve, or when a
# test case of the test suite does not say what draft 2020-12 requires of a schema that stands
# on its own: such a pair has no answer. An entry is a case id, or a folder followed by `/*`
# for every case below it. For the test suite a folder is one test case, or one file.
#
# Each [[override]] lists cases and the labels they get in place of upstream's. `a_subsumes_b`
# and `b_subsumes_a` are true or false; a label that is left out is one the corpus does not
# claim. The note says what is wrong with upstream's label and is copied into the case.json
# of every case listed.
#
# A case may be listed only once.
#
# The labels hold for draft 2020-12 with format asserted and patterns read in the dialect of
# the Rust regex crate. `make test-corpus` checks every label that can be checked by
# validating instances, which includes the corrected ones.


# ----------------------------------------------------------------------------
# Left out: schemas that are not valid draft 2020-12, or that do not resolve
# ----------------------------------------------------------------------------

[[exclude]]
reason = "The schemas are not valid draft 2020-12: they contain an empty oneOf."
cases = [
  "additional-as-uneval/o47922.original_not_unevalEliminated",
  "additional-as-uneval/o47922.unevalEliminated_not_original",
]

[[exclude]]
reason = "The schemas are not valid draft 2020-12: a type array lists \"array\" twice."
cases = [
  "additional-as-uneval/o83092.original_not_unevalEliminated",
  "additional-as-uneval/o83092.unevalEliminated_not_original",
]
[[exclude]]
reason = "The schema declares another dialect than draft 2020-12 as its $schema."
cases = [
  "json-schema-test-suite/optional/format-assertion/0/*",
  "json-schema-test-suite/optional/format-assertion/1/*",
  "json-schema-test-suite/vocabulary/2/*",
  "json-schema-test-suite/vocabulary/3/*",
]

[[exclude]]
reason = "The schema references a schema of an older draft, and the test expects that schema to be read as its own draft."
cases = [
  "json-schema-test-suite/optional/cross-draft/2/*",
  "json-schema-test-suite/optional/cross-draft/3/*",
]

[[exclude]]
reason = "The schema does not resolve when it stands on its own: it references a document by a URL other than the $id that the document gives itself, and an embedded document is known by its $id only."
cases = [
  "json-schema-test-suite/id/22/*",
  "json-schema-test-suite/id/23/*",
]

[[exclude]]
reason = "The expected results hold only where dependencies still works. Draft 2020-12 replaced it by dependentRequired and dependentSchemas, so under draft 2020-12 it is an unknown keyword that asserts nothing."
cases = [
  "json-schema-test-suite/optional/dependencies-compatibility/*",
]

[[exclude]]
reason = "With format asserted, draft 2020-12 does not say what an unknown format accepts, and an implementation may refuse the schema. The expected results are those of format as an annotation."
cases = [
  "json-schema-test-suite/format-unknown/0/*",
]

[[exclude]]
reason = "The test case tells numbers apart by digits that a double does not hold, and the corpus writes numbers as doubles."
cases = [
  "json-schema-test-suite/optional/bignum/5/*",
  "json-schema-test-suite/optional/bignum/8/*",
  "json-schema-test-suite/optional/bignum/9/*",
  "json-schema-test-suite/optional/bignum/10/*",
  "json-schema-test-suite/optional/bignum/12/*",
]


