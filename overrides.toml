# Where the corpus departs from an upstream label, and why.
#
# Each [[override]] lists cases and the labels they get in place of upstream's. `a_subsumes_b`
# and `b_subsumes_a` are true or false; a label that is left out is one the corpus does not
# claim. The note says what is wrong with upstream's label and is copied into the case.json
# of every case listed. A case may be listed only once.
#
# The labels hold for draft 2020-12 with format asserted and patterns read in the dialect of
# the Rust regex crate. `make test-corpus` checks every label that can be checked by
# validating instances, which includes the corrected ones.


