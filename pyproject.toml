[project]
name = "subsumes-benchmark"
version = "0.10.2"
description = "A benchmark for JSON Schema subsumption checkers: pairs of draft 2020-12 schemas with known answers, and the command that runs a checker over them."
# The page of the package on PyPI is that of the repository, so every link and every
# picture in it is a full URL.
readme = "README.md"
# The code is MIT. The package holds the corpus besides, as one archive, and the corpus
# keeps the licences of its sources: GPL-3.0 for what is built from the inclusion artifact,
# and MIT for what is built from the test suite. Their texts go into the package with ours.
license = "MIT AND GPL-3.0-only"
license-files = ["LICENSE", "corpus/*/*/LICENSE"]
authors = [{ name = "Georg Wölflein", email = "georgw7777@gmail.com" }]
requires-python = ">=3.14"
keywords = ["json-schema", "subschema", "inclusion", "containment", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# The build needs Pydantic, which reads the configuration files, and otherwise the standard
# library only; what the tests need is in the dev group. Running a checker needs a validator
# besides, for the counterexamples. Its version is pinned, since it decides which of them
# count: a run is then held against the same validator wherever it is installed. What
# validating an instance as the labels read a schema needs besides is in the validation group.
dependencies = [
    "jsonschema-rs==0.61.2",
    "pydantic>=2.14.3",
]

# What only the report needs, which draws charts: `subsumes-benchmark[report]`.
[project.optional-dependencies]
report = [
    "matplotlib>=3.10",
]

[project.scripts]
subsumes-benchmark = "subsumes_benchmark.compare.__main__:main"

[project.urls]
Repository = "https://github.com/georg-wolflein/subsumes-benchmark"
Issues = "https://github.com/georg-wolflein/subsumes-benchmark/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["corpus/**", "sources/**"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",       # pycodestyle errors
  "W",       # pycodestyle warnings
  "F",       # pyflakes
  "I",       # isort
  "B",       # flake8-bugbear
  "C4",      # flake8-comprehensions
  "UP",      # pyupgrade
  "D",       # pydocstyle
  "TID",     # tidy imports (disallow relative imports)
  "ICN",     # import conventions
  "SIM",     # simplify code
  "PTH",     # use pathlib
  "N",       # PEP8 naming
  "FURB",    # refurb
  "RUF",     # Ruff rules
  "PT",      # pytest style
  "TC",      # imports only needed for type checking
  "PLC0415", # import-outside-top-level
]
ignore = [
  "D417",   # requires documentation for every function parameter
  "D1",     # missing docstrings
  "RUF001", # unicode
]
pydocstyle = { convention = "google" }
isort = { combine-as-imports = true }

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads the annotations of a model when the class is created, so what they name must
# be imported for real.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "subsumes_benchmark.config.Config",
  "subsumes_benchmark.generated.checker.CheckerSpec",
  "subsumes_benchmark.generated.collections.CollectionsSpec",
  "subsumes_benchmark.generated.derived.DerivedSpec",
  "subsumes_benchmark.generated.overrides.OverridesSpec",
  "subsumes_benchmark.generated.run.RunSpec",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Generated code: a description from a schema is one long line.
"src/subsumes_benchmark/generated/*" = ["E501"]

# How `make models` writes src/subsumes_benchmark/generated/ from the schemas under schemas/.
[tool.datamodel-codegen]
input-file-type = "jsonschema"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
base-class = "subsumes_benchmark.config.Config"
enum-field-as-literal = "all"
use-type-alias-type = true
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
use-field-description = true
use-attribute-docstrings = true
use-double-quotes = true
disable-timestamp = true
type-mappings = ["uri=string"]
# Where a schema references the metaschema of draft 2020-12, the generator reads a short
# stand-in for it from this folder and fetches nothing.
http-local-ref-path = "schemas/generator"
formatters = ["ruff-format", "ruff-check"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "ignore"

[tool.ty.environment]
root = ["src", "tests"]

[tool.ty.src]
# An adapter under checkers/ runs in an environment of its own, so `make typecheck` checks
# each one against that environment.
exclude = ["corpus", "sources", "checkers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    { include-group = "validation" },
    "check-jsonschema>=0.39.0",
    "datamodel-code-generator>=0.97.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
# What `subsumes_benchmark.validation` imports besides the validator of a run: the tests
# validate with it, and so does deriving a label from a counterexample.
validation = [
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
    "regress>=2026.9.1",
]
